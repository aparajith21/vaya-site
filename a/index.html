<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/vaya-logo.png" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/vaya-logo.png" />
  <title>Opening Vaya…</title>
  <meta name="description" content="Opening your plan in Vaya." />
  <meta name="theme-color" content="#ff5a3d" />
  <meta name="apple-itunes-app" content="app-id=6763957598" />
  <meta property="og:title" content="Plan invite · Vaya" />
  <meta property="og:description" content="Opening your plan in Vaya." />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --bg: #fff8f6;
      --text: #101624;
      --muted: #667085;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #ffece6 0%, var(--bg) 45%, #fff 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      padding: 32px 24px;
      border-radius: 28px;
      background: #fff;
      border: 1px solid rgba(16, 22, 36, 0.08);
      box-shadow: 0 24px 64px rgba(31, 42, 68, 0.08);
      text-align: center;
    }
    .brand-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .brand-mark {
      display: block;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(255, 90, 61, 0.26);
      object-fit: cover;
    }
    .brand-name {
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: 1.35rem;
      color: var(--text);
    }
    #status {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-row">
      <img class="brand-mark" src="/assets/vaya-logo.png" alt="" width="34" height="34" decoding="async" />
      <span class="brand-name">Vaya</span>
    </div>
    <p id="status">Opening the app…</p>
  </main>
  <script>
    (function () {
      var APP_STORE = "https://apps.apple.com/us/app/vaya-now/id6763957598";
      var UUID =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      var m = location.pathname.match(/^\/a\/([^/]+)\/?$/);
      var id = m ? m[1] : null;
      var status = document.getElementById("status");

      function goStore() {
        location.replace(APP_STORE);
      }

      if (!id || !UUID.test(id)) {
        status.textContent = "Taking you to the App Store…";
        goStore();
        return;
      }

      var deepLink = "vaya://activity/" + encodeURIComponent(id);
      var fallbackMs = 1800;
      var cancelled = false;
      var timer;

      function cancelFallback() {
        cancelled = true;
        if (timer) clearTimeout(timer);
        timer = null;
      }

      window.addEventListener("pagehide", cancelFallback);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") cancelFallback();
      });

      timer = setTimeout(function () {
        timer = null;
        if (cancelled) return;
        status.textContent = "Taking you to the App Store…";
        location.replace(APP_STORE);
      }, fallbackMs);

      window.location.href = deepLink;
    })();
  </script>
  <noscript>
    <p style="margin-top:24px;text-align:center;font-family:system-ui,sans-serif;">
      <a href="https://apps.apple.com/us/app/vaya-now/id6763957598">Download Vaya on the App Store</a>
    </p>
  </noscript>
</body>
</html>
